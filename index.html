<div id="appointment-form" class="space-y-3">
    <input type="text" id="name" class="w-full px-4 py-3 rounded-xl border border-slate-100 outline-none text-sm bg-slate-50" placeholder="Nombre completo">
    <input type="tel" id="phone" class="w-full px-4 py-3 rounded-xl border border-slate-100 outline-none text-sm bg-slate-50" placeholder="WhatsApp (10 dígitos)">
    <input type="date" id="date" class="w-full px-4 py-3 rounded-xl border border-slate-100 outline-none text-sm bg-slate-50 font-bold">
    
    <div id="hours-grid" class="grid grid-cols-3 gap-2 min-h-[40px]">
        <p class="col-span-3 text-center text-slate-300 text-[10px] py-2 italic">Selecciona una fecha...</p>
    </div>

    <div id="payment-area" class="hidden animate-fade-in space-y-2 mt-4">
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl text-center">
            <p class="text-[11px] text-blue-700 font-black uppercase tracking-tighter">MERCADO PAGO</p>
            <p class="text-[8px] text-blue-500 font-bold uppercase mb-2">Transferencia Anticipo 50%</p>
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-blue-200">
                <span id="clabe-text" class="font-mono text-xs font-bold text-slate-700 tracking-tight">722969010024864152</span>
                <button onclick="copyClabe()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-[9px] font-black uppercase">COPIAR</button>
            </div>
            <p id="copy-status" class="text-[9px] text-blue-500 mt-1 font-bold hidden">¡CLABE COPIADA!</p>
        </div>
    </div>

    <button id="submit-btn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm shadow-xl mt-2 uppercase tracking-widest active:scale-95 transition-all">
        CONFIRMAR Y AGENDAR
    </button>
</div>

<script>
    // Actualiza la lógica del botón en tu script para que se comporte así:
    document.getElementById('submit-btn').onclick = async () => {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const date = document.getElementById('date').value;
        
        if(!name || phone.length < 10 || !selectedHour) return alert('Por favor, completa todos los campos y selecciona un horario.');
        
        const btn = document.getElementById('submit-btn');
        
        // Si es la primera vez que hace clic, mostramos el pago
        if(document.getElementById('payment-area').classList.contains('hidden')) {
            document.getElementById('payment-area').classList.remove('hidden');
            btn.innerText = "YA REALICÉ MI PAGO";
            btn.className = "w-full bg-blue-600 text-white py-4 rounded-2xl font-black text-sm shadow-xl mt-2 uppercase tracking-widest";
            return; // Detenemos aquí para que vea el pago
        }

        // Si hace clic por segunda vez (confirmando el pago), agendamos
        btn.disabled = true; 
        btn.innerText = "RESERVANDO...";
        
        await db.collection('citas').add({ 
            nombre: name, 
            telefono: "52"+phone, 
            fecha: date, 
            hora: selectedHour 
        });
        
        btn.innerText = "ESPACIO APARTADO";
        btn.className = "w-full bg-green-500 text-white py-4 rounded-2xl font-black text-sm uppercase";
        
        const msj = `Hola Lic. Fernanda, soy ${name}. Ya realicé el pago y aparté mi cita para el ${date} a las ${selectedHour}.`;
        window.open(`https://wa.me/${FERNANDA_PHONE}?text=${encodeURIComponent(msj)}`, '_blank');
    };
</script>
